# Intentionally an empty workspace root.
#
# This project lives under the parent repo's gitignored projects/ tree, and the parent repo's
# own pnpm-workspace.yaml sits two directories up. Without this file pnpm walks
# upward, finds that one, and resolves against a workspace this package is not a
# member of. Declaring an empty workspace here stops the search at the project
# root so installs are self-contained.
packages: []
